name: Stupid Money research collector
on:
  push:
    branches: [main]
    paths: ['stupid-money-lab/*.py', 'stupid-money-lab/test_watcher.py', '.github/workflows/stupid-money-lab.yml']
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: stupid-money-research
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: vars.STUPID_MONEY_MONITOR_PAUSED != 'true'
    env:
      PAPER_LEVERAGE_MODE: ${{ vars.STUPID_MONEY_PAPER_LEVERAGE_MODE || 'source' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify paper math
        run: python -m unittest discover -s stupid-money-lab -p 'test_*.py'
      - name: Collect public events and paper quotes
        id: collect
        env:
          WINDOW_SECONDS: ${{ github.event_name == 'push' && '120' || '3300' }}
        run: python stupid-money-lab/watcher.py --seconds "$WINDOW_SECONDS" --publish-every 30
      - name: Persist public evidence
        if: always()
        run: |
          git config user.name 'Stupid Money research collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stupid-money-lab/data stupid-money-lab/state.json stupid-money-lab/dashboard.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Stupid Money public observations [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve evidence artifact even if commit fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stupid-money-evidence-${{ github.run_id }}
          path: |
            stupid-money-lab/data/
            stupid-money-lab/state.json
            stupid-money-lab/dashboard.json
          retention-days: 30
      - name: Hand off to next bounded collector window
        if: success() && steps.collect.outcome == 'success' && vars.STUPID_MONEY_MONITOR_PAUSED != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'stupid-money-lab.yml',
              ref: 'main'
            });
            core.notice('Next collector requested. Queue/setup gaps remain measurable; not gap-free hosting.');
